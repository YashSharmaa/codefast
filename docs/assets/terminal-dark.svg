<svg xmlns="http://www.w3.org/2000/svg" width="880" height="429" viewBox="0 0 880 429" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="t">codefast on the Linux kernel, 44 million lines</title>
  <desc id="d">Three codefast commands in a terminal, run on the Linux kernel. codefast callers switch_fpu_return prints the definition and all three call sites with their code lines. codefast path sys_read ext4_file_read_iter prints the call path in four hops, the last one through the file_operations table. codefast grep -F with a kernel message prints the function that writes it.</desc>
  <style>@keyframes t1{0%,3.16%{transform:scaleX(1);animation-timing-function:steps(71,end)}15.12%,100%{transform:scaleX(0)}}.t1{transform-box:fill-box;transform-origin:right center;transform:scaleX(0);animation:t1 19.0s linear infinite}@keyframes a2{0%,16.96%{opacity:0}17.59%,94.74%{opacity:1}97.37%,100%{opacity:0}}.a2{animation:a2 19.0s linear infinite}@keyframes a3{0%,17.43%{opacity:0}18.06%,94.74%{opacity:1}97.37%,100%{opacity:0}}.a3{animation:a3 19.0s linear infinite}@keyframes a4{0%,17.91%{opacity:0}18.54%,94.74%{opacity:1}97.37%,100%{opacity:0}}.a4{animation:a4 19.0s linear infinite}@keyframes a5{0%,18.38%{opacity:0}19.01%,94.74%{opacity:1}97.37%,100%{opacity:0}}.a5{animation:a5 19.0s linear infinite}@keyframes a6{0%,18.85%{opacity:0}19.48%,94.74%{opacity:1}97.37%,100%{opacity:0}}.a6{animation:a6 19.0s linear infinite}@keyframes a7{0%,19.33%{opacity:0}19.96%,94.74%{opacity:1}97.37%,100%{opacity:0}}.a7{animation:a7 19.0s linear infinite}@keyframes a8{0%,19.80%{opacity:0}20.43%,94.74%{opacity:1}97.37%,100%{opacity:0}}.a8{animation:a8 19.0s linear infinite}@keyframes t9{0%,26.06%{transform:scaleX(1);animation-timing-function:steps(73,end)}38.36%,100%{transform:scaleX(0)}}.t9{transform-box:fill-box;transform-origin:right center;transform:scaleX(0);animation:t9 19.0s linear infinite}@keyframes a10{0%,40.20%{opacity:0}40.83%,94.74%{opacity:1}97.37%,100%{opacity:0}}.a10{animation:a10 19.0s linear infinite}@keyframes a11{0%,40.67%{opacity:0}41.31%,94.74%{opacity:1}97.37%,100%{opacity:0}}.a11{animation:a11 19.0s linear infinite}@keyframes a12{0%,41.15%{opacity:0}41.78%,94.74%{opacity:1}97.37%,100%{opacity:0}}.a12{animation:a12 19.0s linear infinite}@keyframes a13{0%,41.62%{opacity:0}42.25%,94.74%{opacity:1}97.37%,100%{opacity:0}}.a13{animation:a13 19.0s linear infinite}@keyframes a14{0%,42.09%{opacity:0}42.73%,94.74%{opacity:1}97.37%,100%{opacity:0}}.a14{animation:a14 19.0s linear infinite}@keyframes t15{0%,48.36%{transform:scaleX(1);animation-timing-function:steps(74,end)}60.82%,100%{transform:scaleX(0)}}.t15{transform-box:fill-box;transform-origin:right center;transform:scaleX(0);animation:t15 19.0s linear infinite}@keyframes a16{0%,62.66%{opacity:0}63.29%,94.74%{opacity:1}97.37%,100%{opacity:0}}.a16{animation:a16 19.0s linear infinite}@keyframes a17{0%,63.14%{opacity:0}63.77%,94.74%{opacity:1}97.37%,100%{opacity:0}}.a17{animation:a17 19.0s linear infinite}@keyframes a18{0%,0.00%{opacity:0}0.05%,94.74%{opacity:1}97.37%,100%{opacity:0}}.a18{animation:a18 19.0s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <g class="a18">
  <rect x="0.5" y="0.5" width="879" height="428" rx="10" fill="#010409" stroke="#30363d"/>
  <path d="M1 36V10.5a9.5 9.5 0 0 1 9.5 -9.5H869.5a9.5 9.5 0 0 1 9.5 9.5V36z" fill="#161b22"/>
  <circle cx="22" cy="18" r="5.5" fill="#ff5f57"/><circle cx="41" cy="18" r="5.5" fill="#febc2e"/><circle cx="60" cy="18" r="5.5" fill="#28c840"/>
  <text x="440.0" y="23" font-size="12.5" fill="#9198a1" text-anchor="middle">codefast on the Linux kernel, 44 million lines</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" xml:space="preserve">
    <text x="22" y="67" fill="#ffffff"><tspan fill="#9198a1">$ </tspan>codefast callers switch_fpu_return<tspan fill="#6e7681">   # every call site, with its line</tspan></text>
    <rect class="t1" x="21" y="53" width="569.0" height="19" fill="#010409"/>
    <text class="a2" x="22" y="86" fill="#e6edf3"><tspan fill="#86b6ef">arch/x86/kernel/fpu/core.c</tspan><tspan fill="#9198a1">:888</tspan> void switch_fpu_return(void)  (all 3 call sites, 3 files)</text>
    <text class="a3" x="22" y="105" fill="#e6edf3"><tspan fill="#86b6ef">arch/x86/include/asm/entry-common.h</tspan><tspan fill="#9198a1"></tspan></text>
    <text class="a4" x="22" y="124" fill="#e6edf3">  <tspan fill="#9198a1">56</tspan> arch_exit_work: switch_fpu_return();</text>
    <text class="a5" x="22" y="143" fill="#e6edf3"><tspan fill="#86b6ef">arch/x86/kvm/fpu.h</tspan><tspan fill="#9198a1"></tspan></text>
    <text class="a6" x="22" y="162" fill="#e6edf3">  <tspan fill="#9198a1">182</tspan> kvm_fpu_get: switch_fpu_return();</text>
    <text class="a7" x="22" y="181" fill="#e6edf3"><tspan fill="#86b6ef">arch/x86/kvm/x86.c</tspan><tspan fill="#9198a1"></tspan></text>
    <text class="a8" x="22" y="200" fill="#e6edf3">  <tspan fill="#9198a1">8393</tspan> vcpu_enter_guest: switch_fpu_return();</text>
    <text x="22" y="238" fill="#ffffff"><tspan fill="#9198a1">$ </tspan>codefast path sys_read ext4_file_read_iter<tspan fill="#6e7681">   # how execution gets there</tspan></text>
    <rect class="t9" x="21" y="224" width="584.9" height="19" fill="#010409"/>
    <text class="a10" x="22" y="257" fill="#e6edf3">sys_read → ksys_read → vfs_read → new_sync_read → ext4_file_read_iter (4 hops)</text>
    <text class="a11" x="22" y="276" fill="#e6edf3">  <tspan fill="#86b6ef">fs/read_write.c</tspan><tspan fill="#9198a1">:705</tspan> sys_read calls ksys_read</text>
    <text class="a12" x="22" y="295" fill="#e6edf3">  <tspan fill="#86b6ef">fs/read_write.c</tspan><tspan fill="#9198a1">:696</tspan> ksys_read calls vfs_read</text>
    <text class="a13" x="22" y="314" fill="#e6edf3">  <tspan fill="#86b6ef">fs/read_write.c</tspan><tspan fill="#9198a1">:554</tspan> vfs_read calls new_sync_read</text>
    <text class="a14" x="22" y="333" fill="#e6edf3">  <tspan fill="#86b6ef">fs/read_write.c</tspan><tspan fill="#9198a1">:473</tspan> new_sync_read calls ext4_file_read_iter via file_operations.read_iter</text>
    <text x="22" y="371" fill="#ffffff"><tspan fill="#9198a1">$ </tspan>codefast grep -F "Busy inodes after unmount"<tspan fill="#6e7681">   # who prints this message</tspan></text>
    <rect class="t15" x="21" y="357" width="592.8" height="19" fill="#010409"/>
    <text class="a16" x="22" y="390" fill="#e6edf3">1 matching lines in 1 files</text>
    <text class="a17" x="22" y="409" fill="#e6edf3"><tspan fill="#86b6ef">fs/super.c</tspan><tspan fill="#9198a1">:732</tspan> generic_shutdown_super: "VFS: Busy inodes after unmount of %s (%s)",</text>
  </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="880" height="366" viewBox="0 0 880 366" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="t">72 verified questions about the Linux kernel</title>
  <desc id="d">Mean score for correct answers, from 0 to 1, and median tokens per answer, one direct query per question. codefast 0.96 and 149 tokens, ripgrep best case 0.89 and 384, ripwire 0.66 and 889, cscope 0.44 and 120, GNU Global 0.27 and 54, codebase-memory-mcp 0.26 and 158, universal-ctags 0.13 and 12.</desc>
  <rect x="0.5" y="0.5" width="879" height="365" rx="12" fill="#161b22" stroke="#30363d"/>

  <text x="28" y="42" font-size="20" font-weight="600" fill="#e6edf3">72 verified questions about the Linux kernel</text>
  <text x="28" y="66" font-size="15" fill="#9198a1">One direct query per question, scored against verified answers.</text>

  <text x="236" y="100" font-size="15" font-weight="600" fill="#e6edf3">Correct<tspan dx="5" font-weight="400" fill="#9198a1">(mean score, 0 to 1)</tspan></text>
  <text x="568" y="100" font-size="15" font-weight="600" fill="#e6edf3">Tokens per answer<tspan dx="5" font-weight="400" fill="#9198a1">(median)</tspan></text>


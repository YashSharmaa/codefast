ansform:scaleX(0.333)}10.14%{transform:scaleX(0.333)}12.64%{transform:scaleX(0.667)}15.29%{transform:scaleX(0.667)}17.79%{transform:scaleX(1.000)}100%{transform:scaleX(1.000)}}.g13{transform-box:fill-box;transform-origin:left center;animation:g13 14.0s linear infinite}@keyframes a14{0%,18.86%{opacity:0}21.00%,92.86%{opacity:1}96.43%,100%{opacity:0}}.a14{animation:a14 14.0s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>

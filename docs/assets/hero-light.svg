<svg xmlns="http://www.w3.org/2000/svg" width="880" height="388" viewBox="0 0 880 388" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="t">One question, two sessions</title>
  <desc id="d">The same question asked in two sessions. Without codefast the agent searches and reads file after file, seven requests in all, and everything it read is sent again with each later request. With codefast a card arrives with the prompt, one call gives the exact answer, and the session costs 0.30 of the other one.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="880" height="396" viewBox="0 0 880 396" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="t">The same session, with and without codefast</title>
  <desc id="d">What a Claude Code session with the codefast plugin costs as a share of the same session without it, per kind of task: who calls this method 0.30, four such questions in one session 0.17, rename a go method everywhere 0.29, a question about the linux kernel 0.94, fix a bug or add a feature 0.99.</desc>
  <rect x="0.5" y="0.5" width="879" height="395" rx="12" fill="#161b22" stroke="#30363d"/>

  <text x="28" y="42" font-size="20" font-weight="600" fill="#e6edf3">The same session, with and without codefast</text>
  <text x="28" y="66" font-size="15" fill="#9198a1">Cost of a Claude Code session with the plugin, as a share of the same session without it.</text>

  <!-- bench/results/live-haiku.jsonl, the table 'In real sessions' of the README. bars start at x=348, 330 px stand for a cost of 1.00 -->
  <path d="M347.5 110V338" stroke="#484f58"/>
  <path d="M678.5 110V338" stroke="#484f58"/>
  <text x="678" y="102" font-size="14" fill="#9198a1" text-anchor="middle">without codefast = 1.00</text>
  <text x="332" y="130" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="end">Who calls this method?</text>
  <text x="332" y="148" font-size="13.5" fill="#9198a1" text-anchor="end">13 questions about a Go repository</text>
  <path fill="#3987e5" d="M348 122h95.00a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-95.00z"/>
  <text x="457.00" y="135.5" font-size="16" font-weight="600" fill="#e6edf3">0.30</text>
  <text x="332" y="176" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="end">Four such questions in one session</text>
  <text x="332" y="194" font-size="13.5" fill="#9198a1" text-anchor="end">3 sessions</text>
  <path fill="#3987e5" d="M348 168h52.10a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-52.10z"/>
  <text x="414.10" y="181.5" font-size="16" font-weight="600" fill="#e6edf3">0.17</text>
  <text x="332" y="222" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="end">Rename a Go method everywhere</text>
  <text x="332" y="240" font-size="13.5" fill="#9198a1" text-anchor="end">8 renames in a Go repository</text>
  <path fill="#3987e5" d="M348 214h91.70a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-91.70z"/>
  <text x="453.70" y="227.5" font-size="16" font-weight="600" fill="#e6edf3">0.29</text>
  <text x="332" y="268" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="end">A question about the Linux kernel</text>
  <text x="332" y="286" font-size="13.5" fill="#9198a1" text-anchor="end">18 questions</text>
  <path fill="#3987e5" d="M348 260h306.20a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-306.20z"/>
  <text x="688.00" y="273.5" font-size="16" font-weight="600" fill="#e6edf3">0.94</text>
  <text x="332" y="314" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="end">Fix a bug or add a feature</text>
  <text x="332" y="332" font-size="13.5" fill="#9198a1" text-anchor="end">12 issues, failing tests given</text>
  <path fill="#3987e5" d="M348 306h322.70a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-322.70z"/>
  <text x="688.00" y="319.5" font-size="16" font-weight="600" fill="#e6edf3">0.99</text>

  <text x="28" y="376" font-size="13.5" fill="#9198a1">Haiku 5.5 in Claude Code 2.1.323, one run per task and arm. Cost is priced from the size of every request.</text>
</svg>

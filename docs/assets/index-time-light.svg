<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="t">Time to index the Linux kernel</title>
  <desc id="d">Seconds to build a fresh index of the Linux kernel on one machine. codefast 8.0, ripwire 34, GNU Global 43, universal-ctags 48, cscope 119, codebase-memory-mcp 725.</desc>
  <rect x="0.5" y="0.5" width="879" height="349" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>

  <text x="28" y="42" font-size="20" font-weight="600" fill="#1f2328">Time to index the Linux kernel</text>
  <text x="28" y="66" font-size="15" fill="#59636e">Seconds for a fresh index of 97,242 files and 44 million lines. Shorter is better.</text>

  <!-- the numbers of the README table "Index a huge repository" (bench/results/k0).
       bars start at x=239. 520 px stand for 725 s, so a bar is 0.7172 px per second -->
  <path d="M238.5 91V291" stroke="#afb8c1"/>
  <text x="222" y="111.5" font-size="16" font-weight="600" fill="#1f2328" text-anchor="end">codefast</text>
  <path fill="#2a78d6" d="M239 97h2.87a2.87 2.87 0 0 1 2.87 2.87v12.26a2.87 2.87 0 0 1 -2.87 2.87h-2.87z"/>
  <text x="252.74" y="111.5" font-size="16" font-weight="600" fill="#1f2328">8.0 s</text>
  <text x="222" y="145.5" font-size="16" fill="#1f2328" text-anchor="end">ripwire</text>
  <path fill="#9aa4ae" d="M239 131h20.39a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-20.39z"/>
  <text x="271.39" y="145.5" font-size="16" fill="#1f2328">34 s</text>
  <text x="222" y="179.5" font-size="16" fill="#1f2328" text-anchor="end">GNU Global</text>
  <path fill="#9aa4ae" d="M239 165h26.84a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-26.84z"/>
  <text x="277.84" y="179.5" font-size="16" fill="#1f2328">43 s</text>
  <text x="222" y="213.5" font-size="16" fill="#1f2328" text-anchor="end">universal-ctags</text>
  <path fill="#9aa4ae" d="M239 199h30.43a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-30.43z"/>
  <text x="281.43" y="213.5" font-size="16" fill="#1f2328">48 s</text>
  <text x="222" y="247.5" font-size="16" fill="#1f2328" text-anchor="end">cscope</text>
  <path fill="#9aa4ae" d="M239 233h81.35a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-81.35z"/>
  <text x="332.35" y="247.5" font-size="16" fill="#1f2328">119 s</text>
  <text x="222" y="281.5" font-size="16" fill="#1f2328" text-anchor="end">codebase-memory-mcp</text>
  <path fill="#9aa4ae" d="M239 267h516a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-516z"/>
  <text x="767" y="281.5" font-size="16" fill="#1f2328">725 s</text>

  <text x="28" y="316" font-size="14" fill="#59636e">Same machine. Median of three runs for codefast 0.2.1, one run for each of the others.</text>
  <text x="28" y="335" font-size="14" fill="#59636e">codebase-memory-mcp publishes 3 min for its own run.</text>
</svg>

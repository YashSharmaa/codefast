<svg xmlns="http://www.w3.org/2000/svg" width="880" height="462" viewBox="0 0 880 462" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="t">How a question travels through codefast</title>
  <desc id="d">The agent asks a question through the command line, the MCP server or a hook. codefast looks it up in an index that follows the agent's edits and returns one answer that carries the code lines. The agent no longer needs a grep followed by several file reads.</desc>
  <rect x="0.5" y="0.5" width="879" height="461" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>

  <!-- codefast: three ways in, one index -->
  <rect x="248" y="20" width="608" height="122" rx="12" fill="#e2ebf6"/>
  <text x="266" y="43" font-size="15" font-weight="600" fill="#1f2328">codefast</text>
  <text x="838" y="43" font-size="14" fill="#59636e" text-anchor="end">one binary, no LLM calls</text>

  <rect x="24" y="54" width="128" height="72" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
  <text x="88" y="87" font-size="20" font-weight="600" fill="#1f2328" text-anchor="middle">Agent</text>
  <text x="88" y="109" font-size="14" fill="#59636e" text-anchor="middle">any harness</text>

  <rect x="264" y="54" width="330" height="72" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="429" y="87" font-size="20" font-weight="600" fill="#1f2328" text-anchor="middle">CLI · MCP · hook</text>
  <text x="429" y="109" font-size="14" fill="#59636e" text-anchor="middle">command, tool call, or after a grep</text>

  <rect x="650" y="54" width="190" height="72" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="745" y="87" font-size="20" font-weight="600" fill="#1f2328" text-anchor="middle">Index</text>
  <text x="745" y="109" font-size="14" fill="#59636e" text-anchor="middle">follows your edits</text>

  <!-- question out, answer back -->
  <g stroke="#2a78d6" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M152 90H254"/>
    <path d="M594 90H640"/>
    <path d="M745 126V166"/>
    <path d="M88 176V136"/>
  </g>
  <g fill="#2a78d6">
    <path d="M264 90l-11-5.5v11z"/>
    <path d="M650 90l-11-5.5v11z"/>
    <path d="M745 176l-5.5-11h11z"/>
    <path d="M88 126l-5.5 11h11z"/>
  </g>
  <text x="200" y="78" font-size="14" fill="#59636e" text-anchor="middle">question</text>
  <text x="101" y="160" font-size="14" fill="#59636e">answer</text>

  <!-- the answer, as codefast printed it for question F3-08 of bench/k3 -->
  <rect x="24" y="176" width="832" height="212" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
  <path d="M24.75 216H855.25" stroke="#d1d9e0"/>
  <text x="836" y="202" font-size="15" font-weight="600" fill="#1f2328" text-anchor="end">1 call · 98 tokens</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
    <text x="44" y="202" fill="#59636e" textLength="303.48" xml:space="preserve">$ codefast callers switch_fpu_return</text>
    <text x="44" y="242" fill="#1f2328" textLength="741.84" xml:space="preserve">arch/x86/kernel/fpu/core.c:888 void switch_fpu_return(void)  (all 3 call sites, 3 files)</text>
    <text x="44" y="264" fill="#1f2328" textLength="295.05" xml:space="preserve">arch/x86/include/asm/entry-common.h</text>
    <text x="60.86" y="286" fill="#1f2328" textLength="328.77" xml:space="preserve">56 arch_exit_work: switch_fpu_return();</text>
    <text x="44" y="308" fill="#1f2328" textLength="151.74" xml:space="preserve">arch/x86/kvm/fpu.h</text>
    <text x="60.86" y="330" fill="#1f2328" textLength="311.91" xml:space="preserve">182 kvm_fpu_get: switch_fpu_return();</text>
    <text x="44" y="352" fill="#1f2328" textLength="151.74" xml:space="preserve">arch/x86/kvm/x86.c</text>
    <text x="60.86" y="374" fill="#1f2328" textLength="362.49" xml:space="preserve">8393 vcpu_enter_guest: switch_fpu_return();</text>
  </g>
  <path d="M470 252h8v128h-8" fill="none" stroke="#2a78d6" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="492" y="321" font-size="14" fill="#59636e">every call site, with its code line</text>

  <!-- what the agent no longer has to do -->
  <text x="24" y="429" font-size="15" font-weight="600" fill="#1f2328">Instead of</text>
  <g fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="124" y="406" width="70" height="36" rx="8"/>
    <rect x="218" y="406" width="96" height="36" rx="8"/>
    <rect x="338" y="406" width="96" height="36" rx="8"/>
    <rect x="458" y="406" width="96" height="36" rx="8"/>
  </g>
  <g stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M199 424h13m-5-4l5 4l-5 4"/>
    <path d="M319 424h13m-5-4l5 4l-5 4"/>
    <path d="M439 424h13m-5-4l5 4l-5 4"/>
  </g>
  <g font-size="15" fill="#59636e" text-anchor="middle">
    <text x="159" y="429">grep</text>
    <text x="266" y="429">read file</text>
    <text x="386" y="429">read file</text>
    <text x="506" y="429">read file</text>
  </g>
  <text x="576" y="429" font-size="14" fill="#59636e">each step is another round trip</text>
</svg>

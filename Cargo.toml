[package]
name = "codefast"
version = "0.2.4"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "LLM-free code intelligence for AI coding harnesses: fast structural index, token-efficient answers"
repository = "https://github.com/YashSharmaa/codefast"
readme = "README.md"
keywords = ["code-intelligence", "mcp", "tree-sitter", "agents", "code-search"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "codefast"
path = "src/lib.rs"

[[bin]]
name = "codefast"
path = "src/main.rs"

[[example]]
name = "dump_tree"
required-features = ["lang-c"]

[dependencies]
tree-sitter = "0.27"
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
tree-sitter-php = { version = "0.25", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
ignore = "0.4"
rayon = "1"
memmap2 = "0.9"
mimalloc = { version = "0.1", default-features = false }
rustc-hash = "2"
hashbrown = "0.16"
anyhow = "1"
memchr = "2"
bytemuck = { version = "1", features = ["derive"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
globset = "0.4"
regex = "1"
regex-syntax = "0.8"
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[features]
default = [
    "lang-c",
    "lang-cpp",
    "lang-python",
    "lang-js",
    "lang-go",
    "lang-rust",
    "lang-java",
    "lang-php",
    "lang-csharp",
    "lang-ruby",
    "lang-swift",
    "lang-kotlin",
]
lang-c = ["dep:tree-sitter-c"]
lang-cpp = ["dep:tree-sitter-cpp"]
lang-python = ["dep:tree-sitter-python"]
lang-js = ["dep:tree-sitter-javascript", "dep:tree-sitter-typescript"]
lang-go = ["dep:tree-sitter-go"]
lang-rust = ["dep:tree-sitter-rust"]
lang-java = ["dep:tree-sitter-java"]
lang-csharp = ["dep:tree-sitter-c-sharp"]
lang-kotlin = ["dep:tree-sitter-kotlin-ng"]
lang-php = ["dep:tree-sitter-php"]
lang-ruby = ["dep:tree-sitter-ruby"]
lang-swift = ["dep:tree-sitter-swift"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false
panic = "abort"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
